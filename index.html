    <!--
      Google Consent Mode v2 defaults.

      This runs before any tag can load so that a Google tag arriving later
      never sees an unset consent state. The app's consent module (see
      src/lib/analytics.ts) only fetches a third-party script after the visitor
      grants the matching category, so on a fresh visit nothing is requested.
    -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() { window.dataLayer.push(arguments); }
      window.gtag = window.gtag || gtag;
      gtag('consent', 'default', {
        ad_storage: 'denied',
        ad_user_data: 'denied',
        ad_personalization: 'denied',
        analytics_storage: 'denied',
        functionality_storage: 'granted',
        security_storage: 'granted',
        wait_for_update: 500
      });
      gtag('set', 'ads_data_redaction', true);
      gtag('set', 'url_passthrough', true);
      window.__rememberedConsentDefaults = true;
    </script>
